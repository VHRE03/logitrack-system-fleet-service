# ==========================================
# Server Configuration
# ==========================================
server:
  port: 8082

# ==========================================
# Spring Application Configuration
# ==========================================
spring:
  application:
    name: fleet-service

  # Actual database connection for the development environment
  datasource:
    url: jdbc:postgresql://localhost:5433/fleet_db
    username: logitrack_admin
    password: SuperSecretPassword123!
    driver-class-name: org.postgresql.Driver
  
  # JPA and Hibernate configuration for PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

# ==========================================
# OpenAPI and Swagger UI Configuration
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    disable-swagger-default-url: true
  packages-to-scan: com.vhre.fleet_service
  model-converters:
    deprecating-converter:
      enabled: false

# ==========================================
# Eureka Discovery Client Configuration
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/